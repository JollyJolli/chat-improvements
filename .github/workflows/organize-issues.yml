name: Organize issue metadata

# One-time initialization plus an explicitly repeatable maintenance action.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/organize-issues.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Set up project labels and milestones
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Idempotent: never replaces unrelated labels or changes issue state.
            const labelSpecs = [
              ['type: bug', 'd73a4a', 'Something is not working'],
              ['type: feature', '1f6feb', 'New end-user functionality'],
              ['type: design', 'a371f7', 'Visual design and presentation'],
              ['type: test', 'fbca04', 'Manual QA or automated validation'],
              ['area: chat-hud', '0e8aab', 'Chat rendering and display'],
              ['area: player-heads', 'd93f0b', 'Player avatars and sender identity'],
              ['area: compatibility', 'b60205', 'Minecraft and server compatibility'],
              ['area: clipboard', 'bfd4f2', 'Per-message copy functionality'],
              ['area: mentions', 'c2e0c6', 'Mentions and player targeting'],
              ['area: settings', '006b75', 'Settings, command and keybind UI'],
              ['status: needs-qa', 'f9d0c4', 'Needs a real client-side test'],
              ['status: deferred', 'c5def5', 'Intentionally postponed'],
              ['priority: high', 'e99695', 'Important before the next release']
            ];
            const existingLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 }
            );
            const existingLabelNames = new Set(existingLabels.map(l => l.name.toLowerCase()));
            for (const [name, color, description] of labelSpecs) {
              if (existingLabelNames.has(name.toLowerCase())) {
                await github.rest.issues.updateLabel({ owner, repo, name, color, description });
              } else {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            const milestoneSpecs = [
              ['v0.1.0 — Timestamps', 'Initial timestamp support and launch compatibility'],
              ['v0.2.0 — Player Heads', 'Known-player avatar support'],
              ['v0.3.0 — Dark Neon Beta', 'Copy, mentions, settings and verified UI baseline'],
              ['v0.4.0 — Native Chat RC', 'Native compact and expanded chat, Quick Mention and release QA'],
              ['Future — Server Compatibility', 'Deferred large-public-server head attribution research']
            ];
            const existingMilestones = await github.paginate(
              github.rest.issues.listMilestones, { owner, repo, state: 'all', per_page: 100 }
            );
            const milestoneNumbers = new Map(existingMilestones.map(m => [m.title, m.number]));
            for (const [title, description] of milestoneSpecs) {
              if (!milestoneNumbers.has(title)) {
                const response = await github.rest.issues.createMilestone({
                  owner, repo, title, description, state: 'open'
                });
                milestoneNumbers.set(title, response.data.number);
              }
            }

            const assignments = [
              [3, 'v0.1.0 — Timestamps', ['type: test', 'area: chat-hud', 'status: needs-qa']],
              [4, 'v0.2.0 — Player Heads', ['type: feature', 'area: player-heads']],
              [5, 'v0.4.0 — Native Chat RC', ['type: feature', 'area: chat-hud', 'status: needs-qa']],
              [6, 'v0.1.0 — Timestamps', ['type: bug', 'area: compatibility']],
              [8, 'Future — Server Compatibility', ['type: bug', 'area: player-heads', 'area: compatibility', 'status: deferred']],
              [9, 'v0.3.0 — Dark Neon Beta', ['type: feature', 'area: clipboard']],
              [10, 'v0.3.0 — Dark Neon Beta', ['type: feature', 'area: mentions']],
              [11, 'v0.4.0 — Native Chat RC', ['type: feature', 'area: mentions', 'status: needs-qa']],
              [16, 'v0.3.0 — Dark Neon Beta', ['type: test', 'area: chat-hud']],
              [17, 'v0.3.0 — Dark Neon Beta', ['type: feature', 'area: settings']],
              [18, 'v0.3.0 — Dark Neon Beta', ['type: design', 'area: settings']],
              [25, 'v0.4.0 — Native Chat RC', ['type: design', 'area: chat-hud']],
              [27, 'v0.4.0 — Native Chat RC', ['type: test', 'area: chat-hud', 'status: needs-qa', 'priority: high']],
              [28, 'v0.4.0 — Native Chat RC', ['type: design', 'area: chat-hud']]
            ];

            for (const [issue_number, title, labels] of assignments) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels });
              const current = await github.rest.issues.get({ owner, repo, issue_number });
              const targetNumber = milestoneNumbers.get(title);
              if (current.data.milestone?.number !== targetNumber) {
                await github.rest.issues.update({
                  owner, repo, issue_number, milestone: targetNumber
                });
              }
              core.info(`Organized #${issue_number}: ${title} / ${labels.join(', ')}`);
            }
            core.info(`Finished ${assignments.length} issues across ${milestoneSpecs.length} milestones.`);
