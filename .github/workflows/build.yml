name: Build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Validate localization files
        run: python3 scripts/check_translations.py
      - name: Build mod
        run: gradle build --stacktrace
      - name: Validate release JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t primary_jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [ "${#primary_jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one primary remapped mod JAR, got ${#primary_jars[@]}"
            find build/libs -maxdepth 1 -type f -print
            exit 1
          fi
          jar tf "${primary_jars[0]}" | grep -Fx 'fabric.mod.json'
          cp "${primary_jars[0]}" dist/
          (cd dist && sha256sum -- *.jar > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Upload installable artifact and checksum
        uses: actions/upload-artifact@v4
        with:
          name: chat-improvements-dev
          path: dist/*
          if-no-files-found: error
